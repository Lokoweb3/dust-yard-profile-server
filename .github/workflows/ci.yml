name: CI

# Runs on every push and pull request. Turn on Railway's "Wait for CI" so a
# deploy only goes out when all of these pass.
on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Repo safety checks
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node scripts/check-repo.mjs

  smoke:
    name: Lint, build check + smoke test
    needs: checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: ci
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://postgres:ci@localhost:5432/postgres
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Catch missing imports between modules
        run: npm run lint
      - name: Game build is up to date with the sources in game/
        run: |
          npm run build
          if [ -n "$(git status --porcelain public/)" ]; then git status --porcelain public/; echo "public/ is out of date: run npm run build and commit the result"; exit 1; fi
      - name: Match checks catch faked results
        run: npm run test:matches
      - name: Old data imports into Postgres and survives a restart
        run: npm run test:db
      - name: Smoke test (on Postgres)
        run: npm run test:smoke

  e2e:
    name: Game in a real browser (solo + co-op)
    needs: checks
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: ci
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://postgres:ci@localhost:5432/postgres
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - name: Keep screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: screenshots
          path: test-results/
          if-no-files-found: ignore

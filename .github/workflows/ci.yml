name: CI

# Runs on every push and pull request. Turn on Railway's "Wait for CI" so a
# deploy only goes out when all of these pass.
on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Repo safety checks
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node scripts/check-repo.mjs

  smoke:
    name: Lint, build check + smoke test
    needs: checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Catch missing imports between modules
        run: npm run lint
      - name: Game build is up to date with game/dust-yard.html
        run: |
          npm run build
          if [ -n "$(git status --porcelain public/)" ]; then git status --porcelain public/; echo "public/ is out of date: run npm run build and commit the result"; exit 1; fi
      - run: npm run test:smoke

  e2e:
    name: Game in a real browser (solo + co-op)
    needs: checks
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - name: Keep screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: screenshots
          path: test-results/
          if-no-files-found: ignore
